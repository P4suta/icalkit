[package]
name = "ical-query"
publish = false
description = "RFC 4791 CalDAV filter evaluation: does this calendar resource match this calendar-query"
keywords = ["caldav", "rfc4791", "calendar", "query", "no-std"]
categories = ["date-and-time", "network-programming", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The whole graph this crate is allowed, and the reason it is a crate at all (docs/adr/0012).
# Evaluating a `time-range` needs expansion from `ical-recur` and resolution from `ical-tz`;
# `ical-dav`'s spine gives it `ical-core` alone, so the evaluator sits above all four as a
# consumer rather than becoming a link in that spine. Nothing here is a dependency of
# `ical-dav`, which is what keeps ADR 0004's graph the way round it is.
ical-core = { path = "../ical-core", version = "0.0.0" }
ical-dav = { path = "../ical-dav", version = "0.0.0" }
ical-recur = { path = "../ical-recur", version = "0.0.0" }
ical-tz = { path = "../ical-tz", version = "0.0.0" }

[lints]
workspace = true
