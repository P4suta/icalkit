[package]
name = "ical-core"
description = "RFC 5545 iCalendar model, parser, and serializer: lossless round trip, sans-I/O, no_std"
keywords = ["icalendar", "ics", "rfc5545", "calendar", "no-std"]
categories = ["parser-implementations", "date-and-time", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The content line grammar and the vocabulary that sits below it. A path plus a version so
# that `just purity` sees a dependency resolved from inside this workspace rather than from a
# registry, and so that a published release still resolves.
ical-grammar = { path = "../ical-grammar", version = "0.0.0" }

[lints]
workspace = true
