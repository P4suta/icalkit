[package]
name = "icalkit-conformance"
publish = false
description = "A conformance and interoperability corpus for iCalendar and CalDAV, runnable against any implementation"
keywords = ["conformance", "interop", "icalendar", "caldav", "testing"]
categories = [
  "development-tools::testing",
  "date-and-time",
  "parser-implementations",
]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# This target is an unpublished shared-source isolation helper for white-box tests, not a Rust
# API. Keep doctests enabled, but do not ask workspace rustdoc to publish internal links under
# this second crate root.
[lib]
doc = false

[[bin]]
name = "capture-audit"
path = "src/bin/capture_audit.rs"

# The private source is path-included from `crates/icalkit`, outside this package directory, so
# cargo-shear cannot see its direct xmlparser import. jiff is visible through capture-audit. The
# iTIP chapter is likewise included by tests/itip_chapter.rs until that corpus moves behind the
# subject protocol.
[package.metadata.cargo-shear]
ignored = ["xmlparser"]
ignored-paths = ["src/itip.rs"]

[dependencies]
icalkit = { path = "../icalkit", version = "0.0.0" }
jiff = { version = "0.2.35", default-features = false, features = [
  "alloc",
  "tz-fat",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
xmlparser = { version = "0.13.6", default-features = false }

[lints]
workspace = true
