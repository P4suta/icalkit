[package]
name = "icalkit-conformance"
publish = false
description = "A conformance and interoperability corpus for iCalendar and CalDAV, runnable against any implementation"
keywords = ["conformance", "interop", "icalendar", "caldav", "testing"]
categories = [
  "development-tools::testing",
  "date-and-time",
  "parser-implementations",
]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

# This target is an unpublished shared-source isolation helper for white-box tests, not a Rust API.
# Keep doctests enabled, but do not ask workspace rustdoc to publish internal links under this second crate root.
[lib]
doc = false

[[bin]]
name = "capture-audit"
path = "src/bin/capture_audit.rs"

[dependencies]
icalkit = { path = "../icalkit", version = "0.1.0" }
icu_calendar = { version = "2.4.0", default-features = false, features = [
  "compiled_data",
] }
jiff = { version = "1.0.0", default-features = false, features = [
  "alloc",
  "tz-fat",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
xmlparser = { version = "0.13.6", default-features = false }

[lints]
workspace = true
