[package]
name = "icalkit-conformance"
publish = false
description = "A conformance and interoperability corpus for iCalendar and CalDAV, runnable against any implementation"
keywords = ["conformance", "interop", "icalendar", "caldav", "testing"]
categories = [
  "development-tools::testing",
  "date-and-time",
  "parser-implementations",
]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
icalkit = { path = "../icalkit", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The implementation this workspace supplies for the corpus to run against. A path plus a
# version so the dependency resolves from inside this workspace rather than from a registry.
ical-core = { path = "../ical-core", version = "0.0.0" }
# The CalDAV layer the XML chapter of this corpus is run against.
ical-dav = { path = "../ical-dav", version = "0.0.0" }
# The scheduling chapter runs its cases through this crate's own gate, and supplies the state
# they are judged against through `ScheduledComponent` rather than through a `Component`.
ical-itip = { path = "../ical-itip", version = "0.0.0" }
ical-recur = { path = "../ical-recur", version = "0.0.0" }
ical-tz = { path = "../ical-tz", version = "0.0.0" }

[lints]
workspace = true
