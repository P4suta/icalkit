[package]
name = "ical-dav"
publish = false
description = "RFC 4791 CalDAV requests and responses, sans-I/O, usable from the client and the server side"
keywords = ["caldav", "webdav", "rfc4791", "calendar", "sans-io"]
categories = ["network-programming", "web-programming", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# The whole graph this crate is allowed. `Limits`, `Meter`, `Diagnostic` and `Instant` come
# from here because two crates that do not depend on each other both need to name them, and
# `calendar-data` is carried as octets rather than parsed, so nothing above the model is
# reachable from a protocol body (DP-17, ADR-0004).
ical-core = { path = "../ical-core", version = "0.0.0" }
# Private lexical authority only. Namespace resolution, structural validation, limits, and
# octet-preserving calendar-data handling remain in this crate's wrapper.
xmlparser = { version = "0.13.6", default-features = false }

[features]
default = []
# RFC 6578: the `sync-collection` REPORT body and its encoder. Reading a `sync-token` a server
# volunteered is unconditional, because a token costs nothing to carry; asking for one is what
# this buys. The element rows exist either way, so a build without the flag answers
# `DavError::Unsupported` rather than skipping a REPORT it cannot honor.
sync-collection = []

[lints]
workspace = true

# This compatibility harness compiles implementation and XML source that physically lives under
# `crates/icalkit` through `#[path]`. cargo-shear scans only this package directory and cannot
# see either production import there.
[package.metadata.cargo-shear]
ignored = ["ical-core", "xmlparser"]
