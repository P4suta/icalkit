[package]
name = "ical-tz"
description = "RFC 5545 VTIMEZONE against a caller-supplied time zone source: no bundled tzdb, no clock"
keywords = ["vtimezone", "timezone", "icalendar", "calendar", "no-std"]
categories = ["date-and-time", "internationalization", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ical-core = { path = "../ical-core", version = "0.0.0" }

[features]
default = ["vtimezone"]
# The VTIMEZONE half: the observance model, the transition table, and the zone source over
# one. With it off the crate is the trait, the answer types, the identifier and the
# combinator -- the surface a caller needs when the only zone data in play is its own
# (docs/design/ical-tz-api.md).
vtimezone = []

[lints]
workspace = true
