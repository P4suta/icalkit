[package]
name = "ical-itip"
publish = false
description = "RFC 5546 iTIP scheduling semantics as described transitions, with authorization included"
keywords = ["itip", "imip", "rfc5546", "scheduling", "icalendar"]
categories = ["date-and-time", "email", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ical-core = { path = "../ical-core", version = "0.0.0" }
# The `RANGE` vocabulary is `ical-recur`'s `OverrideRange` rather than a second spelling of
# the same two values, for the reason DP-13 gives about the change vocabulary.
ical-recur = { path = "../ical-recur", version = "0.0.0" }
# Only the answer types: a fold side is derived from a `LocalResolution` the caller already
# holds, and this crate resolves no zone of its own. `vtimezone` is off because nothing here
# reads a `VTIMEZONE`; a caller that has one turns it on for `ical-tz` directly.
ical-tz = { path = "../ical-tz", version = "0.0.0", default-features = false }

[features]
default = []
# RFC 6047: the MIME envelope around an iTIP object, and the checks that keep the envelope's
# claims from being taken for the body's. Adds no dependency and changes no authorization
# answer; without it those checks are the caller's to write.
imip = []
# RFC 5546 section 3.3: `VFREEBUSY` payloads. Without it such a payload is refused at
# `ItipMessage::read` rather than silently ignored, because a scheduling message a build
# cannot reason about is not a message it may accept.
freebusy = []

[lints]
workspace = true
