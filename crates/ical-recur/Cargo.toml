[package]
name = "ical-recur"
publish = false
description = "RFC 5545 recurrence: RRULE, RDATE, and EXDATE expansion as a bounded lazy iterator"
keywords = ["rrule", "recurrence", "icalendar", "calendar", "no-std"]
categories = ["date-and-time", "algorithms", "no-std"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
ical-core = { path = "../ical-core", version = "0.0.0" }

[lints]
workspace = true

# This compatibility harness compiles its implementation from `crates/icalkit` through `#[path]`.
# cargo-shear scans only this package directory and cannot see the ical-core imports there.
[package.metadata.cargo-shear]
ignored = ["ical-core"]
