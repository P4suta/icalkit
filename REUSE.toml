#
# Bulk annotations for files without inline SPDX headers.

version = 1

[[annotations]]
path = [
  "**/*.md",
  "Cargo.lock",
  ".gitignore",
  ".github/CODEOWNERS",
  "LICENSE",
  "LICENSE-MIT",
  "LICENSE-APACHE",
  "crates/icalkit/LICENSE-MIT",
  "crates/icalkit/LICENSE-APACHE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 icalkit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# An inline header would change the fixture bytes covered by the round-trip tests.
[[annotations]]
path = ["**/tests/fixtures/**", "crates/icalkit/src/internal/**/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 icalkit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["crates/icalkit-conformance/corpus/*.jsonl"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 icalkit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["api/*.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 icalkit contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"
