# typos — strict spell check across the repo, run by the CI `typos` job
# (crate-ci/typos) and the pre-commit hook. Fix typos rather than suppress them; keep the
# allowlist below to the minimum the calendaring vocabulary needs. Every entry is a token
# an RFC chose, not a word this project misspelled.

[default]
locale = "en-us"

[default.extend-words]
# RFC 5545 property and component names appear verbatim in prose and in tests.
rrule = "rrule"         # the recurrence rule property
exrule = "exrule"       # the RFC 2445 exception rule, obsoleted but still encountered
rdate = "rdate"         # recurrence date property
exdate = "exdate"       # exception date property
dtstart = "dtstart"     # start date-time property
dtend = "dtend"         # end date-time property
vtimezone = "vtimezone"
vevent = "vevent"
vtodo = "vtodo"
vjournal = "vjournal"
vfreebusy = "vfreebusy"
vcalendar = "vcalendar"
itip = "itip"           # RFC 5546, iCalendar Transport-Independent Interoperability Protocol
imip = "imip"           # RFC 6047, iCalendar Message-Based Interoperability Protocol
caldav = "caldav"
carddav = "carddav"
tzid = "tzid"           # time zone identifier parameter

[files]
extend-exclude = [
  "target/**",
  "**/*.lock",
  # Machine-generated by release-plz from commit subjects; short SHAs split into
  # subtokens and get flagged. The source is reviewed at commit time.
  "CHANGELOG.md",
  # Calendars exported from real clients: vendor property names and human text in many
  # languages, preserved byte-exact on purpose. A spell checker cannot say anything true
  # about them — a fixture for a fold that splits a codepoint holds `caf` followed by half
  # of an `é`, and every suggestion it earns is a suggestion to break the case. Both paths
  # are listed because `.gitattributes` marks both `-text` and `REUSE.toml` bulk-annotates
  # both: where the corpus lives is a question the milestone that collects it answers.
  "**/tests/corpus/**",
  "**/tests/fixtures/**",
]

[type.toml]
extend-glob = ["*.toml"]

[type.rust]
extend-glob = ["*.rs"]
