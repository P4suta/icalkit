# Development and CI use the same exact toolchain as mise.toml.
# Candidate API snapshots and MSRV checks select their own toolchains.
# Target checks install thumbv7em-none-eabi and wasm32-unknown-unknown on demand.

[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
