name = "icalkit"
summary = "A Rust library for parsing, editing, and querying iCalendar data"
install = "cargo add icalkit --git https://github.com/P4suta/icalkit.git"
usage_language = "rust"
usage = '''
fn print_event_ids(bytes: &[u8]) -> Result<(), icalkit::Error> {
    let calendar = icalkit::Calendar::parse(bytes)?;
    for event in calendar.events() {
        if let Some(uid) = event.uid() {
            println!("{uid}");
        }
    }
    Ok(())
}
'''
documentation_index = true
copyright = "2026 icalkit contributors"
license = "MIT OR Apache-2.0"

