name = "icalkit"
summary = "An unreleased Rust library for parsing, editing, and querying iCalendar data"
install = """
git clone https://github.com/P4suta/icalkit.git
cd icalkit
mise install
"""
usage_language = "sh"
usage = "mise x -- cargo run --locked -p icalkit --example golden_path"
documentation_index = true
copyright = "2026 icalkit contributors"
license = "MIT OR Apache-2.0"

