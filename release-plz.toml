# Release configuration. Nothing here publishes automatically: the workspace is at 0.0.0
# and the first published version should be a decision, not a side effect of merging.
#
# The crates move as one version. `ical-conform` is meant to be run against implementations
# that are not this one (docs/adr/0006), so it will eventually want a cadence that is not
# tied to ours; while it is pre-1.0 the shared group costs less than a second release story.

[workspace]
dependencies_update = false
release_always = false
# Pre-1.0 the public surface is still being discovered. A future release phase must choose
# and document its own compatibility policy rather than silently freezing this.
semver_check = false
git_tag_enable = false
git_release_enable = false
changelog_update = false

# `ical-core` carries the changelog because every other crate is a layer over its model, so
# its history is the stack's history. One changelog per published crate, six of them, would
# describe one release six times.
#
# The crate set is written here and in the root manifest's `members`, and `xtask purity` reads
# the two against each other: this file described a seven-crate workspace for a full landing
# after `ical-grammar` was folded into `ical-core`, because the release path is the one path no
# gate runs (docs/adr/0004, D-0003).
[[package]]
name = "ical-core"
version_group = "icalkit"
changelog_update = true
changelog_path = "./CHANGELOG.md"
changelog_include = [
  "ical-recur",
  "ical-tz",
  "ical-itip",
  "ical-dav",
  "ical-conform",
]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_draft = true

[[package]]
name = "ical-recur"
version_group = "icalkit"

[[package]]
name = "ical-tz"
version_group = "icalkit"

[[package]]
name = "ical-itip"
version_group = "icalkit"

[[package]]
name = "ical-dav"
version_group = "icalkit"

[[package]]
name = "ical-conform"
version_group = "icalkit"
