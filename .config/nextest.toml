# Keep local and CI execution on the version whose configuration is validated
# below. Newer compatible releases remain usable because this is a minimum.
nextest-version = "0.9.140"

[profile.default]
# A failure must remain visible. If a narrow override ever adds retries, a
# pass-after-retry is still a failing result rather than hidden flakiness.
retries = 0
flaky-result = "fail"
# The conformance sweeps are CPU-bound, and migration compatibility harnesses temporarily
# compile the same kernel tests in a second root. Unbounded host parallelism makes four
# individually bounded fixture sweeps starve each other until the timeout; four workers finish
# the complete suite faster and keep that timeout about stuck work rather than scheduler load.
test-threads = 4

# Parsing and recurrence are pure computation over in-memory text: nothing here
# legitimately runs for a minute, and an expansion that does is the candidate
# budget failing (docs/adr/0002). Report at ten seconds and terminate a genuinely
# stuck test.
slow-timeout = { period = "10s", terminate-after = 6, grace-period = "5s" }

[profile.ci]
inherits = "default"
# Finish the profile so one failure does not hide independent regressions.
fail-fast = false
